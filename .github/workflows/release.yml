# Builds the Android APK and the Linux bundle and attaches them to a GitHub
# Release, so updating a device is a download rather than a rebuild:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Or run it by hand from the Actions tab (workflow_dispatch) to get the
# artifacts for the current commit without cutting a release.
#
# Android signing: with the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets set, the APK is signed
# with that key; otherwise it falls back to the runner's debug key, which
# differs from your laptop's, so Android would refuse it as an update over
# an APK you built locally. See "Releases" in the README.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Every CI build gets a higher versionCode than the last, so Android (and
  # Obtainium) see each one as an update.
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cat > android/key.properties <<PROPS
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || VERSION="0.0.0-${GITHUB_SHA::7}"
          flutter build apk --release \
            --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          mv build/app/outputs/flutter-apk/app-release.apk Mewsic-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mewsic-android
          path: Mewsic-android.apk

  linux:
    name: Linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || VERSION="0.0.0-${GITHUB_SHA::7}"
          flutter build linux --release \
            --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          tar -C build/linux/x64/release -czf Mewsic-linux-x64.tar.gz bundle

      - uses: actions/upload-artifact@v4
        with:
          name: Mewsic-linux-x64
          path: Mewsic-linux-x64.tar.gz

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [android, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Mewsic-android.apk
            Mewsic-linux-x64.tar.gz
          generate_release_notes: true
